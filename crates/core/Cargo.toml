[package]
name = "nnb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NN Builder core: graph model, shape engine, PyTorch code generation, remote training control"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
