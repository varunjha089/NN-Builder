# Build the app on macOS, Windows and Linux for every push to main and every tag. For a tag vX.Y.Z the "release" job attaches the
# installers to that GitHub release, which is where the app's automatic update looks (app/src-tauri/src/update.rs, pick_asset:
# *_aarch64.app.zip, *_x64-setup.exe, *_amd64.AppImage / *_amd64.deb). The builds are not signed.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, bundles: app }
          # Intel Macs: cross-compiled on the Apple-silicon runner
          - { name: macOS-Intel, os: macos-latest, bundles: app, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, bundles: nsis }
          - { name: Linux, os: ubuntu-22.04, bundles: "deb,appimage" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the Tauri window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: UI (type check and build)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Tests
        run: cargo test --workspace
      - name: App
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          case "$RUNNER_OS" in
            macOS)   if [ -n "${{ matrix.target }}" ]; then
                       ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/NN Builder.app" "out/NN-Builder_${version}_x64.app.zip"
                     else
                       ditto -c -k --keepParent "target/release/bundle/macos/NN Builder.app" "out/NN-Builder_${version}_aarch64.app.zip"
                     fi ;;
            Windows) for f in target/release/bundle/nsis/*.exe; do cp "$f" "out/NN-Builder_${version}_x64-setup.exe"; done ;;
            Linux)   cp target/release/bundle/deb/*.deb "out/nn-builder_${version}_amd64.deb"
                     cp target/release/bundle/appimage/*.AppImage "out/nn-builder_${version}_amd64.AppImage" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: NN-Builder-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then echo "the code is version $version but the tag is $TAG"; exit 1; fi
          # a release written by hand (draft) keeps its notes; otherwise one is made (published) with generated notes
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "NN Builder $version" --generate-notes
          ls -l dist
          gh release upload "$TAG" --clobber dist/*
